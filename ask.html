<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A question for you 💌</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffd6de">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="card">
            <div class="stamp" aria-hidden="true">💘</div>
            <div class="gif"><img src="https://media.tenor.com/RBa37_6ApVcAAAAi/cute-adorable.gif" alt="Cute bear holding a heart" width="152" height="152"></div>
            <h1 id="question">Will you be my Valentine?</h1>
            <p id="from" class="from" hidden></p>
            <p id="note" class="note" hidden></p>
            <div class="answers">
                <button type="button" id="yesButton" class="btn">Yes 💖</button>
                <button type="button" id="noButton" class="btn ghost">No</button>
            </div>
            <p id="hint" class="hint" role="status"></p>
        </div>
    </main>
    <footer>
        Made with ❤️ by pythontilk · <a href="index.html">make your own</a>
    </footer>

    <script src="app.js"></script>
    <script>
        driftingHearts();

        const ask = readAsk();
        const question = document.getElementById('question');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const hint = document.getElementById('hint');

        if (ask.name) {
            question.textContent = '';
            const name = document.createElement('em');
            name.textContent = ask.name;
            question.append(name, ', will you be my Valentine?');
            document.title = ask.name + ', a question for you 💌';
        }
        if (ask.from) {
            const from = document.getElementById('from');
            from.textContent = 'from ' + ask.from;
            from.hidden = false;
        }
        if (ask.message) {
            const note = document.getElementById('note');
            note.textContent = ask.message;
            note.hidden = false;
        }

        const phrases = [
            'Are you sure?', 'What if I asked really nicely?', 'Pretty please', 'With a cherry on top',
            'What about a matcha frostie', 'PLEASE POOKIE', 'But :*(', 'I am going to die', 'Yep im dead',
            'ok ur talking to my ghost now', 'please babe', ':((((', 'PRETTY PLEASE', 'Estoy muerto', 'No :('
        ];
        let noCount = 0;
        let offset = { x: 0, y: 0 };

        yesButton.addEventListener('click', () => {
            window.location.href = pageUrl('yes.html', ask.raw);
        });

        // Moves the No button sideways and down, never up over the question, kept inside the viewport.
        function dodge() {
            const rect = noButton.getBoundingClientRect();
            const home = { left: rect.left - offset.x, top: rect.top - offset.y };
            const margin = 12;
            const reach = Math.min(140, window.innerWidth / 2.5);
            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            let next = offset;
            for (let attempt = 0; attempt < 8; attempt++) {
                next = {
                    x: clamp((Math.random() * 2 - 1) * reach, margin - home.left, window.innerWidth - margin - rect.width - home.left),
                    y: clamp(Math.random() * reach, 0, window.innerHeight - margin - rect.height - home.top)
                };
                if (Math.hypot(next.x - offset.x, next.y - offset.y) >= 50) break;
            }
            offset = next;
            noButton.style.transform = `translate(${offset.x}px, ${offset.y}px)`;
        }

        noButton.addEventListener('click', () => {
            noCount++;
            if (noCount > phrases.length) {
                if (ask.canSayNo) {
                    window.location.href = pageUrl('no.html', ask.raw);
                    return;
                }
                noButton.classList.add('gone');
                hint.textContent = 'No is not on the menu 💘';
                return;
            }
            noButton.textContent = phrases[noCount - 1];
            yesButton.style.transform = `scale(${Math.min(1 + noCount * 0.09, 2.2)})`;
            dodge();
        });

        // Once they have used up the phrases and may not say no, the button runs from the mouse.
        noButton.addEventListener('pointerenter', (event) => {
            if (event.pointerType === 'mouse' && noCount >= phrases.length && !ask.canSayNo) {
                dodge();
            }
        });
    </script>
</body>
</html>
